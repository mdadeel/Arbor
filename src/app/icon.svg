<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="arbor-grad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="arbor-glow" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Ambient rounded background container -->
  <rect width="32" height="32" rx="7" fill="#0c0d0e" />
  <rect width="32" height="32" rx="7" fill="url(#arbor-glow)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#27272a" stroke-opacity="0.8" />

  <!-- Arbor Geometric Tree & AST Branching Structure -->
  <!-- Central Trunk -->
  <line x1="16" y1="25" x2="16" y2="12" stroke="url(#arbor-grad)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Left Primary Branch -->
  <path d="M16 19 L10 13 L10 9" stroke="url(#arbor-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Primary Branch -->
  <path d="M16 19 L22 13 L22 9" stroke="url(#arbor-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Center Branch -->
  <line x1="16" y1="12" x2="16" y2="7" stroke="url(#arbor-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Cross Interconnect / Syntactic Link -->
  <path d="M10 13 L16 16 L22 13" stroke="url(#arbor-grad)" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Terminals (Leaves / AST Nodes) -->
  <!-- Top Center Node -->
  <circle cx="16" cy="6" r="2.2" fill="#38bdf8" />
  <!-- Top Left Node -->
  <circle cx="10" cy="8.5" r="2" fill="#10b981" />
  <!-- Top Right Node -->
  <circle cx="22" cy="8.5" r="2" fill="#60a5fa" />
  <!-- Trunk Base Node -->
  <circle cx="16" cy="25" r="1.8" fill="#059669" />
</svg>
