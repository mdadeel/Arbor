<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Canopy Background Frame -->
  <rect width="32" height="32" fill="#0B0F0C" />
  <rect x="0.5" y="0.5" width="31" height="31" stroke="#2D3930" stroke-width="1" />

  <!-- AST Edges: Outer "A" Legs -->
  <line x1="16" y1="7" x2="10" y2="16" stroke="#EDF4EE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="16" y1="7" x2="22" y2="16" stroke="#EDF4EE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="10" y1="16" x2="6" y2="25" stroke="#EDF4EE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="22" y1="16" x2="26" y2="25" stroke="#EDF4EE" stroke-width="1.8" stroke-linecap="round" />

  <!-- AST Bridge Crossbar -->
  <line x1="10" y1="16" x2="22" y2="16" stroke="#EDF4EE" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central AST Spine (Dashed Graph Edge) -->
  <line x1="16" y1="7" x2="16" y2="16" stroke="#B7ED69" stroke-width="1.4" stroke-dasharray="2 1.5" stroke-linecap="round" />
  <line x1="16" y1="16" x2="16" y2="25" stroke="#B7ED69" stroke-width="1.4" stroke-dasharray="2 1.5" stroke-linecap="round" />

  <!-- Branch Vertices (Graph Nodes) -->
  <circle cx="10" cy="16" r="1.8" fill="#0B0F0C" stroke="#EDF4EE" stroke-width="1.4" />
  <circle cx="16" cy="16" r="1.8" fill="#B7ED69" />
  <circle cx="22" cy="16" r="1.8" fill="#0B0F0C" stroke="#EDF4EE" stroke-width="1.4" />

  <!-- Apex Root AST Node (Accent) -->
  <circle cx="16" cy="7" r="2.2" fill="#B7ED69" />

  <!-- Leaf Syntax Tokens (Terminal Square Nodes) -->
  <rect x="4.5" y="23.5" width="3" height="3" fill="#EDF4EE" />
  <rect x="14.5" y="23.5" width="3" height="3" fill="#B7ED69" />
  <rect x="24.5" y="23.5" width="3" height="3" fill="#EDF4EE" />
</svg>
