<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none">
  <defs>
    <linearGradient id="arbor-logo-grad" x1="4" y1="32" x2="32" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="arbor-logo-glow" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Mark container (36x36) -->
  <g transform="translate(0, 0)">
    <rect width="36" height="36" rx="8" fill="#090a0f" />
    <rect width="36" height="36" rx="8" fill="url(#arbor-logo-glow)" />
    <rect x="0.5" y="0.5" width="35" height="35" rx="7.5" stroke="#27272a" stroke-opacity="0.9" />

    <g transform="translate(2, 2)">
      <!-- Tree / AST glyph -->
      <line x1="16" y1="25" x2="16" y2="12" stroke="url(#arbor-logo-grad)" stroke-width="2.2" stroke-linecap="round" />
      <path d="M16 19 L10 13 L10 9" stroke="url(#arbor-logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M16 19 L22 13 L22 9" stroke="url(#arbor-logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="16" y1="12" x2="16" y2="7" stroke="url(#arbor-logo-grad)" stroke-width="2" stroke-linecap="round" />
      <path d="M10 13 L16 16 L22 13" stroke="url(#arbor-logo-grad)" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />

      <circle cx="16" cy="6" r="2.2" fill="#38bdf8" />
      <circle cx="10" cy="8.5" r="2" fill="#10b981" />
      <circle cx="22" cy="8.5" r="2" fill="#60a5fa" />
      <circle cx="16" cy="25" r="1.8" fill="#059669" />
    </g>
  </g>

  <!-- Wordmark "Arbor" -->
  <text x="48" y="24" fill="#f4f4f5" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5px">Arbor</text>
  
  <!-- Subtle descriptor dot & tag -->
  <circle cx="110" cy="18" r="2" fill="#10b981" />
  <text x="117" y="21" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.5px">DEV</text>
</svg>
